name: GeBIZ Tender Alert Bot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes, 24/7
  workflow_dispatch:          # manual trigger

jobs:
  check-tenders:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen tenders cache
        uses: actions/cache@v4
        with:
          path: seen_tenders.json
          key: seen-tenders-${{ github.run_id }}
          restore-keys: |
            seen-tenders-

      - name: Run GeBIZ bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_BASE_URL:     ${{ secrets.PROXY_BASE_URL }}
        run: python bot.py

      - name: Save seen tenders cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_tenders.json
          key: seen-tenders-${{ github.run_id }}
